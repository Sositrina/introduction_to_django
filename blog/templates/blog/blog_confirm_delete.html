{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <h1>Удалить запись</h1>

    <p>Вы действительно хотите удалить «{{ object.title }}»?</p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Удалить
        </button>

        <a href="{% url 'blog_detail' object.pk %}" class="btn btn-secondary">
            Отмена
        </a>
    </form>
</div>

{% endblock %}
