{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <h1>Блог</h1>

    {% for blog in blogs %}
    <div class="card mb-3">
        <div class="card-body">
            <h2>
                <a href="{% url 'blog_detail' blog.pk %}">
                {{ blog.title }}
                </a>
            </h2>
            <p>{{ blog.content }}</p>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
