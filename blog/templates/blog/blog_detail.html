{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <h1>{{ blog.title }}</h1>

    {% if blog.preview %}
    <img src="{{ blog.preview.url }}"
         alt="{{ blog.title }}"
         class="img-fluid mb-3"
         style="max-width: 400px;">
    {% endif %}

    <p>{{ blog.content }}</p>

    <p>
        <strong>Дата создания:</strong>
        {{ blog.created_at }}
    </p>

    <p>
        <strong>Просмотры:</strong>
        {{ blog.views_count }}
    </p>

    <a href="{% url 'blog_list' %}" class="btn btn-outline-primary">
        Назад
    </a>

    <a href="{% url 'blog_update' blog.pk %}" class="btn btn-outline-secondary">
        Редактировать
    </a>

    <a href="{% url 'blog_delete' blog.pk %}" class="btn btn-outline-danger">
        Удалить
    </a>
</div>

{% endblock %}
